apiVersion: v1
kind: Service
metadata:
  name: umami-sso
  labels:
    app.kubernetes.io/name: umami
    app.kubernetes.io/component: sso
    app.kubernetes.io/part-of: sopec
spec:
  selector:
    app.kubernetes.io/name: umami
    app.kubernetes.io/component: sso
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: umami-sso-login
  labels:
    app.kubernetes.io/name: umami
    app.kubernetes.io/component: sso
    app.kubernetes.io/part-of: sopec
    route: public-cf
spec:
  host: umami.fsd.epfl.ch
  path: /login
  to:
    kind: Service
    name: umami-sso
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: umami-sso-logout
  labels:
    app.kubernetes.io/name: umami
    app.kubernetes.io/component: sso
    app.kubernetes.io/part-of: sopec
    route: public-cf
spec:
  host: umami.fsd.epfl.ch
  path: /logout
  to:
    kind: Service
    name: umami-sso
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami-sso
  labels:
    app.kubernetes.io/name: umami
    app.kubernetes.io/component: sso
    app.kubernetes.io/part-of: sopec
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umami
      app.kubernetes.io/component: sso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umami
        app.kubernetes.io/component: sso
        app.kubernetes.io/part-of: sopec
    spec:
      containers:
        - name: umami-sso
          image: codeberg.org/vanutp/umami-sso:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: umami-sso-secrets
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            timeoutSeconds: 3
