apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: svc0176t-isas-fsd

resources:
  - ../../base

patches:
  - target:
      kind: Route
      name: indico
    patch: |-
      - op: replace
        path: /spec/host
        value: indico-test.fsd.epfl.ch
  - target:
      kind: Deployment
      name: indico-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 768Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
  - target:
      kind: Deployment
      name: indico-celery
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 768Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
  - target:
      kind: Deployment
      name: indico-celery-beat
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
