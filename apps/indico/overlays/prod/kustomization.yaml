apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: svc0176p-isas-fsd

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: indico-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1000Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1500Mi
  - target:
      kind: Deployment
      name: indico-celery
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 400Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 750Mi
  - target:
      kind: Deployment
      name: indico-celery-beat
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
  - target:
      kind: Deployment
      name: indico-redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 96Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 96Mi
