apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: svc0176p-isas-fsd

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: indico-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 20m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 600Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 600Mi
  - target:
      kind: Deployment
      name: indico-celery
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 15m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 300Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 300Mi
  - target:
      kind: Deployment
      name: indico-redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 96Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 96Mi
