apiVersion: apps/v1
kind: Deployment
metadata:
  name: indico-celery
  labels:
    app.kubernetes.io/name: indico
    app.kubernetes.io/component: celery
    app.kubernetes.io/part-of: sopec
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: indico
      app.kubernetes.io/component: celery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indico
        app.kubernetes.io/component: celery
        app.kubernetes.io/part-of: sopec
    spec:
      imagePullSecrets:
        - name: svc0176-pull-secret
      containers:
        - name: celery
          image: quay-its.epfl.ch/svc0176/indico:3.3.14
          imagePullPolicy: Always
          command: ["/opt/indico/run_celery.sh"]
          volumeMounts:
            - name: archive
              mountPath: /opt/indico/archive
            - name: config
              mountPath: /opt/indico/etc/indico.conf
              subPath: indico.conf
              readOnly: true
            - name: tmp
              mountPath: /opt/indico/tmp
            - name: logs
              mountPath: /opt/indico/log
            - name: cache
              mountPath: /opt/indico/cache
            - name: custom
              mountPath: /opt/indico/custom
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 200Mi
            limits:
              memory: 200Mi
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: indico-data
        - name: config
          secret:
            secretName: indico-config
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: custom
          configMap:
            name: indico-theme
            items:
              - key: 00-epfl-colors.css
                path: css/00-epfl-colors.css
              - key: 01-epfl-buttons.css
                path: css/01-epfl-buttons.css
              - key: 10-epfl-header.css
                path: css/10-epfl-header.css
              - key: 20-epfl-type.css
                path: css/20-epfl-type.css
              - key: 30-epfl-cookie-consent.css
                path: css/30-epfl-cookie-consent.css
              - key: 00-epfl-cookie-consent.js
                path: js/00-epfl-cookie-consent.js
              - key: epfl-logo.svg
                path: files/epfl-logo.svg
              - key: favicon-32.png
                path: files/favicon-32.png
              - key: epfl-footer.html
                path: templates/~footer.html
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indico-celery-beat
  labels:
    app.kubernetes.io/name: indico
    app.kubernetes.io/component: celery-beat
    app.kubernetes.io/part-of: sopec
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: indico
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indico
        app.kubernetes.io/component: celery-beat
        app.kubernetes.io/part-of: sopec
    spec:
      imagePullSecrets:
        - name: svc0176-pull-secret
      containers:
        - name: celery-beat
          image: quay-its.epfl.ch/svc0176/indico:3.3.14
          imagePullPolicy: Always
          command: ["/opt/indico/run_celery.sh", "beat"]
          volumeMounts:
            - name: archive
              mountPath: /opt/indico/archive
            - name: config
              mountPath: /opt/indico/etc/indico.conf
              subPath: indico.conf
              readOnly: true
            - name: tmp
              mountPath: /opt/indico/tmp
            - name: logs
              mountPath: /opt/indico/log
            - name: cache
              mountPath: /opt/indico/cache
            - name: custom
              mountPath: /opt/indico/custom
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 128Mi
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: indico-data
        - name: config
          secret:
            secretName: indico-config
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: custom
          configMap:
            name: indico-theme
            items:
              - key: 00-epfl-colors.css
                path: css/00-epfl-colors.css
              - key: 01-epfl-buttons.css
                path: css/01-epfl-buttons.css
              - key: 10-epfl-header.css
                path: css/10-epfl-header.css
              - key: 20-epfl-type.css
                path: css/20-epfl-type.css
              - key: 30-epfl-cookie-consent.css
                path: css/30-epfl-cookie-consent.css
              - key: 00-epfl-cookie-consent.js
                path: js/00-epfl-cookie-consent.js
              - key: epfl-logo.svg
                path: files/epfl-logo.svg
              - key: favicon-32.png
                path: files/favicon-32.png
              - key: epfl-footer.html
                path: templates/~footer.html
