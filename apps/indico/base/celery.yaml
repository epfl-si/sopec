apiVersion: apps/v1
kind: Deployment
metadata:
  name: indico-celery
  labels:
    app.kubernetes.io/name: indico
    app.kubernetes.io/component: celery
    app.kubernetes.io/part-of: sopec
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: indico
      app.kubernetes.io/component: celery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indico
        app.kubernetes.io/component: celery
        app.kubernetes.io/part-of: sopec
    spec:
      imagePullSecrets:
        - name: svc0176-pull-secret
      containers:
        - name: celery
          image: quay-its.epfl.ch/svc0176/indico:3.3.14
          imagePullPolicy: Always
          command: ["/opt/indico/run_celery.sh"]
          volumeMounts:
            - name: archive
              mountPath: /opt/indico/archive
            - name: config
              mountPath: /opt/indico/etc/indico.conf
              subPath: indico.conf
              readOnly: true
            - name: tmp
              mountPath: /opt/indico/tmp
            - name: logs
              mountPath: /opt/indico/log
            - name: cache
              mountPath: /opt/indico/cache
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: indico-data
        - name: config
          secret:
            secretName: indico-config
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indico-celery-beat
  labels:
    app.kubernetes.io/name: indico
    app.kubernetes.io/component: celery-beat
    app.kubernetes.io/part-of: sopec
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: indico
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indico
        app.kubernetes.io/component: celery-beat
        app.kubernetes.io/part-of: sopec
    spec:
      imagePullSecrets:
        - name: svc0176-pull-secret
      containers:
        - name: celery-beat
          image: quay-its.epfl.ch/svc0176/indico:3.3.14
          imagePullPolicy: Always
          command: ["/opt/indico/run_celery.sh", "beat"]
          volumeMounts:
            - name: archive
              mountPath: /opt/indico/archive
            - name: config
              mountPath: /opt/indico/etc/indico.conf
              subPath: indico.conf
              readOnly: true
            - name: tmp
              mountPath: /opt/indico/tmp
            - name: logs
              mountPath: /opt/indico/log
            - name: cache
              mountPath: /opt/indico/cache
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: indico-data
        - name: config
          secret:
            secretName: indico-config
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: cache
          emptyDir: {}
