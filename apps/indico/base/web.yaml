apiVersion: v1
kind: Service
metadata:
  name: indico-web
  labels:
    app.kubernetes.io/name: indico
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: sopec
spec:
  selector:
    app.kubernetes.io/name: indico
    app.kubernetes.io/component: web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: indico
  labels:
    app.kubernetes.io/name: indico
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: sopec
    route: public-cf
spec:
  host: indico.fsd.epfl.ch
  to:
    kind: Service
    name: indico-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indico-web
  labels:
    app.kubernetes.io/name: indico
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: sopec
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: indico
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indico
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: sopec
    spec:
      imagePullSecrets:
        - name: svc0176-pull-secret
      containers:
        - name: indico
          image: quay-its.epfl.ch/svc0176/indico:3.3.14
          imagePullPolicy: Always
          command: ["/opt/indico/docker_entrypoint.sh"]
          args: ["/opt/indico/run_indico.sh"]
          ports:
            - containerPort: 59999
              name: http
          env:
            - name: PGHOST
              value: postgres-cluster-rw
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: indico-db-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: indico-db-credentials
                  key: password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: indico-db-credentials
                  key: database
            - name: XDG_CACHE_HOME
              value: /opt/indico/tmp
          volumeMounts:
            - name: archive
              mountPath: /opt/indico/archive
            - name: config
              mountPath: /opt/indico/etc/indico.conf
              subPath: indico.conf
              readOnly: true
            - name: tmp
              mountPath: /opt/indico/tmp
            - name: logs
              mountPath: /opt/indico/log
            - name: cache
              mountPath: /opt/indico/cache
            - name: custom
              mountPath: /opt/indico/custom
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 400Mi
            limits:
              memory: 400Mi
          readinessProbe:
            tcpSocket:
              port: 59999
            initialDelaySeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 59999
            initialDelaySeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: indico-data
        - name: config
          secret:
            secretName: indico-config
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: custom
          configMap:
            name: indico-theme
            items:
              - key: 00-epfl-colors.css
                path: css/00-epfl-colors.css
              - key: 01-epfl-buttons.css
                path: css/01-epfl-buttons.css
              - key: 10-epfl-header.css
                path: css/10-epfl-header.css
              - key: 20-epfl-type.css
                path: css/20-epfl-type.css
              - key: 30-epfl-cookie-consent.css
                path: css/30-epfl-cookie-consent.css
              - key: 00-epfl-cookie-consent.js
                path: js/00-epfl-cookie-consent.js
              - key: epfl-logo.svg
                path: files/epfl-logo.svg
              - key: favicon-32.png
                path: files/favicon-32.png
              - key: epfl-footer.html
                path: templates/~footer.html
