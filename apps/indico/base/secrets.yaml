apiVersion: v1
kind: Secret
metadata:
  name: indico-db-credentials
  labels:
    app.kubernetes.io/name: indico
    app.kubernetes.io/part-of: sopec
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: indico-user
  password: "{{ .env.database.password }}"
  database: indico-db
---
apiVersion: v1
kind: Secret
metadata:
  name: indico-config
  labels:
    app.kubernetes.io/name: indico
    app.kubernetes.io/part-of: sopec
type: Opaque
stringData:
  indico.conf: |
    SQLALCHEMY_DATABASE_URI = 'postgresql://indico-user:{{ .env.database.password }}@postgres-cluster-rw:5432/indico-db'

    SECRET_KEY = '{{ .env.secret_key }}'
    BASE_URL = 'https://indico{{ .suffix }}.fsd.epfl.ch'
    USE_PROXY = True

    # EPFL theme (see theme.yaml / CUSTOMIZATION_DIR below)
    LOGO_URL = '/static/custom/files/epfl-logo.svg'

    DEFAULT_TIMEZONE = 'Europe/Zurich'
    DEFAULT_LOCALE = 'en_GB'

    REDIS_CACHE_URL = 'redis://indico-redis:6379/0'
    CELERY_BROKER = 'redis://indico-redis:6379/1'

    SMTP_SERVER = ('{{ .env.mail.host }}', 25)
    SMTP_USE_TLS = False
    SMTP_LOGIN = '{{ .env.mail.user }}'
    SMTP_PASSWORD = '{{ .env.mail.password }}'
    NO_REPLY_EMAIL = 'noreply@epfl.ch'
    SUPPORT_EMAIL = '{{ .env.support_email }}'
    PUBLIC_SUPPORT_EMAIL = '{{ .env.support_email }}'

    ENABLE_ROOMBOOKING = False

    LOG_DIR = '/opt/indico/log'
    TEMP_DIR = '/opt/indico/tmp'
    CACHE_DIR = '/opt/indico/cache'
    CUSTOMIZATION_DIR = '/opt/indico/custom'

    STORAGE_BACKENDS = {'default': 'fs:/opt/indico/archive'}
    ATTACHMENT_STORAGE = 'default'

    LOCAL_IDENTITIES = False
    LOCAL_REGISTRATION = False

    # auth.issuer must be the tenant-specific v2.0 issuer, e.g.
    # https://login.microsoftonline.com/<TENANT_ID>/v2.0
    AUTH_PROVIDERS = {
        'microsoft': {
            'type': 'authlib',
            'title': 'EPFL',
            'authlib_args': {
                'client_id': '{{ .env.auth.client_id }}',
                'client_secret': '{{ .env.auth.client_secret }}',
                'server_metadata_url': '{{ .env.auth.issuer }}/.well-known/openid-configuration',
                'client_kwargs': {'scope': 'openid profile email'},
            },
        },
    }
    IDENTITY_PROVIDERS = {
        'microsoft': {
            'type': 'authlib',
            'title': 'EPFL',
            'trusted_email': True,
            'mapping': {
                'user_name': 'preferred_username',
                'first_name': 'given_name',
                'last_name': 'family_name',
                'email': 'email',
            },
            'synced_fields': {'first_name', 'last_name', 'email'},
        },
    }
