apiVersion: v1
kind: Secret
metadata:
  name: splash-db-credentials
  labels:
    app.kubernetes.io/name: splash
    app.kubernetes.io/part-of: sopec
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: splash-user
  password: "{{ .env.database.password }}"
  database: splash-db
---
apiVersion: v1
kind: Secret
metadata:
  name: splash-secrets
  labels:
    app.kubernetes.io/name: splash
    app.kubernetes.io/part-of: sopec
type: Opaque
stringData:
  DATABASE_URL: "postgresql://splash-user:{{ .env.database.password }}@postgres-cluster-rw:5432/splash-db"
  AUTH_SECRET: "{{ .env.auth.secret }}"
  AUTH_URL: "https://splash{{ .suffix }}.fsd.epfl.ch"
  CLIENT_ID: "{{ .env.auth.client_id }}"
  CLIENT_SECRET: "{{ .env.auth.client_secret }}"
  IDENTITY_ISSUER: "{{ .env.auth.identity_issuer }}"
  MAIL_FROM: "{{ .env.mail.from }}"
  SMTP_HOST: "{{ .env.mail.host }}"
  SMTP_PORT: "{{ .env.mail.port }}"
