apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: svc0176p-isas-fsd

resources:
  - ../../base

patches:
  - target:
      kind: NfsSubdirProvisioner
      name: sopec
    patch: |-
      - op: replace
        path: /spec/nfs/server
        value: PLACEHOLDER_NFS_SERVER_PROD
      - op: replace
        path: /spec/nfs/path
        value: PLACEHOLDER_NFS_PATH_PROD
  - target:
      kind: Cluster
      name: postgres-cluster
    patch: |-
      - op: replace
        path: /spec/backup/barmanObjectStore/destinationPath
        value: s3://svc0176-8cddbcda286938ca166635b3af281c01/prod
      - op: replace
        path: /spec/backup/barmanObjectStore/endpointURL
        value: https://s3.epfl.ch
      - op: replace
        path: /spec/resources/requests/cpu
        value: 75m
      - op: replace
        path: /spec/resources/requests/memory
        value: 768Mi
      - op: replace
        path: /spec/resources/limits/memory
        value: 768Mi
      - op: add
        path: /spec/resources/limits/cpu
        value: "4"
      - op: add
        path: /spec/probes
        value:
          liveness:
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 10
            isolationCheck:
              enabled: true
              connectionTimeout: 5000
              requestTimeout: 5000
          readiness:
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 6